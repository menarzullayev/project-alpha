name: ops-agent

on:
  workflow_dispatch:
  push:
    paths: ["apps/ops-agent/**", ".github/workflows/ops-agent.yml"]
  pull_request:
    paths: ["apps/ops-agent/**", ".github/workflows/ops-agent.yml"]

defaults:
  run:
    working-directory: apps/ops-agent

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opsagent_e2e
      APP_URL: http://localhost:3100
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CRON_SECRET: ci-cron-secret-0123456789
      SIGNUP_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ops-agent/package-lock.json
      - run: npm ci
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database opsagent_test' -c 'create database opsagent_e2e'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E
        run: |
          PORT=3100 npm start &
          npx --yes wait-on -t 60000 http://localhost:3100/api/health
          E2E_DATABASE_URL=$DATABASE_URL npm run test:e2e

  # Continuous deployment: every push to main that passes `verify` ships to production.
  # Requires repository secret VERCEL_TOKEN (Vercel → Account Settings → Tokens).
  deploy:
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency: { group: ops-agent-production, cancel-in-progress: false }
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_wG5TakcweEB4REIUJ0aC04sF
      VERCEL_PROJECT_ID: prj_u6euyjOy3LgX89oBL6Pu7n6JlmgH
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check Vercel access
        if: env.VERCEL_TOKEN != ''
        run: |
          api() { curl -s -o /tmp/body -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com$1"; }
          code=$(api /v2/user)
          echo "token → /v2/user: HTTP $code (user: $(jq -r '.user.username // "?"' /tmp/body))"
          [ "$code" = 200 ] || { echo "::error::VERCEL_TOKEN is invalid or expired"; exit 1; }
          code=$(api "/v2/teams/$VERCEL_ORG_ID")
          echo "token → team $VERCEL_ORG_ID: HTTP $code"
          [ "$code" = 200 ] || { echo "::error::Token cannot access team narzullayev — recreate it with Scope = \"narzullayev's team\""; exit 1; }
          code=$(api "/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          echo "token → project opsagent-edu: HTTP $code"
          [ "$code" = 200 ] || { echo "::error::Token cannot access project opsagent-edu"; exit 1; }
      - name: Deploy to Vercel (production)
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::warning::VERCEL_TOKEN secret is not set — skipping automatic deploy."
            exit 0
          fi
          url=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN")
          echo "Deployed: $url"
      - name: Smoke test production
        if: env.VERCEL_TOKEN != ''
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://opsagent-edu.vercel.app/api/health | grep -q '"status":"ok"'; then echo healthy; exit 0; fi
            sleep 10
          done
          echo "::error::Production health check failed"; exit 1
