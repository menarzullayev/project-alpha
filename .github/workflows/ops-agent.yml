name: ops-agent

on:
  push:
    paths: ["apps/ops-agent/**", ".github/workflows/ops-agent.yml"]
  pull_request:
    paths: ["apps/ops-agent/**", ".github/workflows/ops-agent.yml"]

defaults:
  run:
    working-directory: apps/ops-agent

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/opsagent_e2e
      APP_URL: http://localhost:3100
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CRON_SECRET: ci-cron-secret-0123456789
      SIGNUP_RATE_LIMIT: "1000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ops-agent/package-lock.json
      - run: npm ci
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database opsagent_test' -c 'create database opsagent_e2e'
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: E2E
        run: |
          PORT=3100 npm start &
          npx --yes wait-on -t 60000 http://localhost:3100/api/health
          E2E_DATABASE_URL=$DATABASE_URL npm run test:e2e
