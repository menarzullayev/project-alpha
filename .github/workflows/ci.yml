name: Project Alpha CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python -m py_compile cli/project_alpha.py cli/project_alpha_workflow.py cli/project_alpha_audit.py cli/project_alpha_integrity.py cli/project_alpha_semantic.py
