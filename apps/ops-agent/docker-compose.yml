# Local production-like stack: Postgres + app. `docker compose up --build`
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: opsagent
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10
  migrate:
    build: { context: ., target: build }
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/opsagent
    depends_on:
      db: { condition: service_healthy }
  app:
    build: .
    ports: ["3000:3000"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/opsagent
      APP_URL: http://localhost:3000
    depends_on:
      migrate: { condition: service_completed_successfully }
