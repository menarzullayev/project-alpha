[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-alpha"
version = "1.0.0"
description = "Documentation OS framework and CLI"
requires-python = ">=3.10"

[project.scripts]
project-alpha = "project_alpha:main"
project-alpha-workflow = "project_alpha_workflow:main"

[tool.setuptools]
package-dir = {"" = "cli"}
py-modules = ["project_alpha", "project_alpha_workflow"]
